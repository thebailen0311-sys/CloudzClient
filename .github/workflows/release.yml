name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build
        run: gradle build --no-daemon -Pmod_version=1.0.${{ github.run_number }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          sha256sum "$JAR" | cut -d' ' -f1 > jar.sha256
          gh release create "$TAG" "$JAR" jar.sha256 --title "Cloude Client $TAG" --generate-notes
